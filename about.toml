# cargo-about: the licenses nordray-vault's dependencies may use. A dependency under any other license fails the
# build, so it gets a deliberate look first.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-musl"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
