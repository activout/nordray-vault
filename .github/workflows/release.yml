# A v* tag tests, then publishes ghcr.io/activout/nordray-vault:<tag> and a GitHub release with the static
# linux/amd64 binary, its SHA256SUMS and a build provenance attestation. Verify a download with:
#   gh attestation verify nordray-vault_<version>_linux_amd64 --repo activout/nordray-vault
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: docker build --target test --output type=cacheonly .
      - name: Build
        run: |
          docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" -t "$IMAGE" .
          mkdir dist
          id=$(docker create "$IMAGE")
          docker cp "$id:/nordray-vault" "dist/nordray-vault_${VERSION}_linux_amd64"
          docker rm "$id"
          (cd dist && sha256sum nordray-vault_* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/nordray-vault_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          gh release create "$VERSION" dist/* --generate-notes
