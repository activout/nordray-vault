# A v* tag tests, then publishes ghcr.io/activout/nordray-vault:<tag> and a GitHub release with the static
# linux/amd64 binary and its SHA256SUMS. The binary and the image both get a build provenance attestation; the
# image's is also pushed to the registry. Verify with:
#   gh attestation verify nordray-vault_<version>_linux_amd64 --repo activout/nordray-vault
#   gh attestation verify oci://ghcr.io/activout/nordray-vault:<version> --repo activout/nordray-vault
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: docker build --target test --output type=cacheonly .
      - name: Build
        run: |
          docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" -t "$IMAGE" .
          mkdir dist
          id=$(docker create "$IMAGE")
          docker cp "$id:/nordray-vault" "dist/nordray-vault_${VERSION}_linux_amd64"
          docker cp "$id:/THIRD-PARTY-LICENSES" dist/THIRD-PARTY-LICENSES
          docker rm "$id"
          (cd dist && sha256sum nordray-vault_* > SHA256SUMS && cat SHA256SUMS)
      - name: Attest binary
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/nordray-vault_*
      - name: Push image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --generate-notes
